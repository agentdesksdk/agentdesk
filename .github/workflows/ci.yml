name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first. The apps resolve @agentdesk/webmcp through its published
      # exports, so they typecheck and test against packages/webmcp/dist. On a
      # clean checkout there is no dist, and every app check fails on a stale
      # or absent one rather than on anything the PR did.
      - run: pnpm build
      # Each check reports on its own so one run tells you everything that is
      # broken, rather than a chain of skips behind the first failure.
      - run: pnpm typecheck
        if: ${{ !cancelled() }}
      - run: pnpm test
        if: ${{ !cancelled() }}
      - run: pnpm test:pack
        if: ${{ !cancelled() }}
      - run: pnpm run check:docs
        if: ${{ !cancelled() }}
